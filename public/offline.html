<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFB6C1" />
    <title>Ludiko - offline</title>
    <style>
      html,body{margin:0;height:100%;background:#FFF8F0;color:#4A4A4A;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
      h1{margin:0;font-size:2.2rem;color:#DDA0DD}
      p{margin:0;max-width:28rem;line-height:1.5}
      button{margin-top:8px;min-height:48px;padding:0 28px;border:0;border-radius:16px;background:#98FB98;color:#2f4f2f;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <h1>Ludiko</h1>
      <p lang="ro">Nu ai internet acum, iar aplicația nu s-a descărcat încă pe acest dispozitiv. Conectează-te o dată la internet și apoi Ludiko va funcționa și fără conexiune.</p>
      <p lang="en">You are offline and the app has not been saved on this device yet. Connect once and Ludiko will then also work without internet.</p>
      <button type="button" onclick="location.reload()">Reîncearcă / Retry</button>
    </main>
  </body>
</html>

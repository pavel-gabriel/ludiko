name: Tests

on:
  pull_request:
    branches: [main, dev]

# Least privilege: PR checks only read the repository (docs/SECURITY.md)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build

  # Compile firestore.rules and database.rules.json with the real Firebase emulators, so invalid rules
  # (e.g. an RTDB-only method in Firestore rules, or numChildren() in RTDB rules) never reach main.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # firebase + firebase-admin are needed by the executable rules tests
      - run: npm ci

      # Compiles both rules files AND runs tests/rules/emulator-rules.mjs (allowed flows + attacks, docs/SECURITY.md)
      - name: Compile and test Firebase rules in the emulators
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore,database --project demo-ludiko "node tests/rules/emulator-rules.mjs"
